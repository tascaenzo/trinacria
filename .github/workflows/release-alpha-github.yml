name: Release Alpha (GitHub Packages)

on:
  push:
    branches:
      - alpha
  workflow_dispatch:

concurrency: release-alpha

permissions:
  contents: read
  packages: write

jobs:
  release-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci

      - name: Build framework packages
        run: npm run build

      - name: Test framework packages
        run: npm run test:packages

      - name: Generate alpha snapshot versions
        run: npm run version-packages:alpha

      - name: Remap package scope for personal GitHub Packages publish
        run: npm run prepare:alpha:github

      - name: Publish alpha snapshots to GitHub Packages
        run: npm run release:alpha:github
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN != '' && secrets.GITHUB_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
