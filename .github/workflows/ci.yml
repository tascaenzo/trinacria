name: CI

on:
  push:
    branches:
      - unstable
      - develop
      - main
  pull_request:
    branches-ignore:
      - develop
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint static checks
        run: npm run lint

      - name: Build framework packages
        run: npm run build

      - name: Test framework packages
        run: npm run test:packages

      - name: Verify changeset on PR
        if: github.event_name == 'pull_request'
        run: npx changeset status --since=origin/main
