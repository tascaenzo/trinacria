name: CI

on:
  push:
    branches:
      - unstable
      - main
  pull_request:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Biome and documentation formatting checks
        run: npm run format:check

      - name: Verify TypeScript 7 toolchain
        run: npm run toolchain:check

      - name: Biome static checks
        run: npm run check

      - name: Build packages and example applications
        run: npm run build

      - name: Run test suite
        run: npm test

      - name: Enforce package coverage threshold
        run: npm run coverage:all

      - name: Verify changeset on PR
        if: github.event_name == 'pull_request'
        run: npx changeset status --since=origin/main
