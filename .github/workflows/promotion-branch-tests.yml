name: Promotion Branch Tests

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  build-and-test-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint static checks
        run: npm run lint

      - name: Build framework packages
        run: npm run build

      - name: Test framework packages
        run: npm run test:packages
