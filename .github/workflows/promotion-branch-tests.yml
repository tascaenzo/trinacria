name: Promotion Branch Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Biome and documentation formatting checks
        run: npm run format:check

      - name: Verify TypeScript 7 toolchain
        run: npm run toolchain:check

      - name: Biome static checks
        run: npm run check

      - name: Build packages and example applications
        run: npm run build

      - name: Run test suite
        run: npm test

      - name: Enforce package coverage threshold
        run: npm run coverage:all
