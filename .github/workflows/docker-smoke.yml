name: Docker Smoke

on:
  pull_request:
    paths:
      - "apps/api-prisma-postgresql/**"
      - "apps/api-mongoose-mongodb/**"
      - "apps/api-events-redis/**"
      - "apps/api-events-rabbitmq/**"
      - "scripts/docker-smoke.sh"
      - ".github/workflows/docker-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Smoke test api-prisma-postgresql
        run: bash scripts/docker-smoke.sh apps/api-prisma-postgresql

      - name: Smoke test api-mongoose-mongodb
        run: bash scripts/docker-smoke.sh apps/api-mongoose-mongodb

      - name: Smoke test api-events-redis
        run: bash scripts/docker-smoke.sh apps/api-events-redis

      - name: Smoke test api-events-rabbitmq
        run: bash scripts/docker-smoke.sh apps/api-events-rabbitmq
