name: Wiki Sync

on:
  push:
    branches:
      - main
      - develop
    paths:
      - docs/**
      - scripts/sync-wiki.sh
      - .github/workflows/wiki-sync.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync docs to GitHub Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/sync-wiki.sh
          scripts/sync-wiki.sh
