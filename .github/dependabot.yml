version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      development-dependencies:
        dependency-type: development
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /apps/api-events-rabbitmq
      - /apps/api-events-redis
      - /apps/api-mongoose-mongodb
      - /apps/api-prisma-postgresql
      - /apps/app-starter
      - /apps/cron-example
    schedule:
      interval: weekly
