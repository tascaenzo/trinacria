services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DOCKER_POSTGRES_DB}
      POSTGRES_USER: ${DOCKER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${DOCKER_POSTGRES_PORT}:5432"
    volumes:
      - trinacria_api_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DOCKER_POSTGRES_USER} -d ${DOCKER_POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    init: true
    security_opt:
      - no-new-privileges:true
    build:
      context: ../..
      dockerfile: apps/api-prisma-postgresql/Dockerfile
    environment:
      ENV: development
      HOST: 0.0.0.0
      PORT: 4001
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      AUTO_DB_PUSH: "true"
    ports:
      - "${DOCKER_API_BIND_ADDRESS:-127.0.0.1}:${DOCKER_API_PORT}:4001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  trinacria_api_pg_data:
